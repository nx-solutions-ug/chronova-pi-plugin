name: Tests

on:
  push:
    branches: [main, develop, feat/*, fix/*]
  pull_request:
    branches: [main, develop, feat/*, fix/*]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Chooses GitHub's runners or Coolify's for the jobs below; pick-runner.yml has the rules.
  pick-runner:
    permissions: {}
    uses: ./.github/workflows/pick-runner.yml
    with:
      untrusted: ${{ (github.event.pull_request.head.repo.fork || (github.event.issue.pull_request && !github.event.repository.private) || !contains(fromJSON('["","OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association || '')) && true || false }}
    secrets:
      billing-token: ${{ secrets.ACTIONS_BILLING_TOKEN }}

  type-check:
    name: Type Check
    needs: pick-runner
    runs-on: ${{ fromJSON(github.run_attempt == 1 && needs.pick-runner.outputs.runs-on || needs.pick-runner.outputs.rerun-on) }}
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript type check
        run: bun run type-check

  strict-type-check:
    name: Strict Type Check (no skipLibCheck)
    needs: pick-runner
    runs-on: ${{ fromJSON(github.run_attempt == 1 && needs.pick-runner.outputs.runs-on || needs.pick-runner.outputs.rerun-on) }}
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript type check with skipLibCheck disabled
        continue-on-error: true
        run: bun run tsc --noEmit --skipLibCheck false

  lint:
    name: Lint
    needs: pick-runner
    runs-on: ${{ fromJSON(github.run_attempt == 1 && needs.pick-runner.outputs.runs-on || needs.pick-runner.outputs.rerun-on) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run oxlint
        run: bun run lint

      - name: Check formatting with oxfmt
        run: bun run format:check

  build:
    name: Build
    needs: pick-runner
    runs-on: ${{ fromJSON(github.run_attempt == 1 && needs.pick-runner.outputs.runs-on || needs.pick-runner.outputs.rerun-on) }}
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the extension bundle
        run: bun run build

      - name: Verify the bundle keeps the host package external
        run: |
          set -euo pipefail
          test -f dist/index.js
          grep -q 'from "@oh-my-pi/pi-coding-agent"' dist/index.js
